version: "3.8"

services:
  canhgac:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: canhgac-website
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - canhgac-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/canhgac.db
      - AUTH_SECRET=canh-gac-website-production-secret-2026
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - MONITOR_WORKER_CONCURRENCY=5
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  canhgac-data:
    driver: local
